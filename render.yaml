# Render 部署設定
services:
  - type: web
    name: music-xiaobangshou-api
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: music-xiaobangshou-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: music-xiaobangshou-db
    plan: free
    databaseName: music_xiaobangshou
    user: music_user
